<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ägyptisch Trainer</title>
    <style>
        .arabic { font-size: 1.4em; direction: rtl; unicode-bidi: isolate; font-family: 'Amiri', 'Segoe UI', serif; }
        button { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #004b99; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; }
        .success { background: #dcfce7; color: #15803d; padding: 10px; border-radius: 4px; }
        .error { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    {% block content %}{% endblock %}
</body>

<script>
function playAudio(text) {
    const url = "{% url 'tts_audio' %}?text=" + encodeURIComponent(text);
    const audio = new Audio(url);
    audio.play();
}
</script>

</html>
